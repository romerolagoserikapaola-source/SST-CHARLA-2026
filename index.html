<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Plataforma Digital</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .tarjeta {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .boton {
            display: inline-block;
            background-color: #222222;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .boton:hover {
            background-color: #444444;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>

</head>

<body>

<header>
    <h1>Mi Plataforma Digital</h1>
    <p>Bienvenido</p>
</header>

<div class="contenedor">

    <div class="tarjeta">

        <h2>¡Hola! 👋</h2>

        <p>
            Esta es mi primera plataforma web creada con HTML
            y publicada mediante GitHub.
        </p>

        <button class="boton" onclick="mostrarMensaje()">
            Empezar
        </button>

    </div>

</div>

<footer>
    Plataforma Digital 2026
</footer>


<script>

function mostrarMensaje() {

    alert("¡Tu plataforma funciona correctamente!");

}

</script>

</body>

</html>
